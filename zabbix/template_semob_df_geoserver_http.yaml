            - uuid: 05eca948a7164a2caab7c5fd7a3a3756
              name: 'Frota [{#OPERADORA.NOME}]: idade média'
              type: DEPENDENT
              key: semob.fleet.operator.avg_age[{#OPERADORA.KEY}]
              delay: '0'
              history: 31d
              value_type: FLOAT
              units: anos
              description: Idade média da frota da operadora pelo ano_fabrica.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.operators['{#OPERADORA.KEY}'].avg_age
                  error_handler: DISCARD_VALUE
              master_item:
                key: semob.fleet.stats
              tags:
                - tag: component
                  value: frota
                - tag: operadora
                  value: '{#OPERADORA.NOME}'
                - tag: bacia
                  value: '{#OPERADORA.BACIA}'
                - tag: servico
                  value: '{#OPERADORA.SERVICO}'
          master_item:
            key: semob.fleet.stats
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Repassa a lista LLD somente quando a coleta é válida. Coleta inválida não remove recursos descobertos.
                  var d = JSON.parse(value);
                  if (d.ok !== 1) {
                      throw 'Coleta inválida: ' + (d.error || 'sem detalhe');
                  }
                  return JSON.stringify(d.lld);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          lifetime: 7d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
        - uuid: f138fd7b007547d1806c00eef6959180
          name: Descoberta de camadas WFS
          type: DEPENDENT
          key: semob.wfs.layers.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CAMADA}'
                value: '{$SEMOB.LAYER.MATCHES}'
                formulaid: A
              - macro: '{#CAMADA}'
                value: '{$SEMOB.LAYER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Cria um contador resultType=hits por camada. Passageiros fica excluída por padrão: consultas sem filtro excederam 20 s na investigação de 09/10/2026.'
          item_prototypes:
            - uuid: 49fb454faeb94330890f9a4b18ed830a
              name: 'Camada [{#CAMADA}]: registros'
              type: HTTP_AGENT
              key: semob.layer.count["{#CAMADA}"]
              delay: '{$SEMOB.LAYER.INTERVAL}'
              history: 31d
              value_type: UNSIGNED
              timeout: '{$SEMOB.TIMEOUT}'
              url: '{$SEMOB.URL}'
              query_fields:
                - name: service
                  value: WFS
                - name: version
                  value: 2.0.0
                - name: request
                  value: GetFeature
                - name: typeNames
                  value: '{#CAMADA}'
                - name: resultType
                  value: hits
              verify_peer: 'YES'
              verify_host: 'YES'
              description: 'numberMatched via resultType=hits, sem baixar feições. Título: {#CAMADA.TITULO}. Em camadas de horários e viagens a contagem é de registros, não de linhas distintas.'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: DISCARD_VALUE
                - type: CHECK_XML_ERROR
                  parameters:
                    - string(//*[local-name()='ExceptionText'])
                - type: XMLPATH
                  parameters:
                    - string(/*[local-name()='FeatureCollection']/@numberMatched)
              tags:
                - tag: component
                  value: camadas
                - tag: camada
                  value: '{#CAMADA}'
              trigger_prototypes:
                - uuid: 7bd2469cc2334ad7b12b843895535a73
                  expression: last(/SEMOB DF GeoServer by HTTP/semob.layer.count["{#CAMADA}"])=0
                  name: 'SEMOB: camada {#CAMADA} sem registros'
                  priority: WARNING
                  description: O GeoServer informou numberMatched=0 para a camada.
                  tags:
                    - tag: scope
                      value: quality
                - uuid: 3ca9976651d9448bb3e7f73f2c9efb70
                  expression: nodata(/SEMOB DF GeoServer by HTTP/semob.layer.count["{#CAMADA}"],{$SEMOB.LAYER.NODATA})=1
                  name: 'SEMOB: camada {#CAMADA} sem contagem há {$SEMOB.LAYER.NODATA}'
                  priority: WARNING
                  description: Falhas HTTP são descartadas no pré-processamento. A ausência prolongada de valores indica erro de coleta.
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: semob.wfs.capabilities
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Extrai Name e Title de cada FeatureType do WFS GetCapabilities (prefixos de namespace opcionais).
                  if (value.indexOf('WFS_Capabilities') === -1) {
                      throw 'Resposta não é um documento WFS GetCapabilities';
                  }

                  function decode(s) {
                      return s.replace(/&#(\d+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 10)); })
                          .replace(/&#x([0-9a-fA-F]+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 16)); })
                          .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
                          .replace(/&amp;/g, '&').trim();
                  }

                  var re = /<(?:[\w.-]+:)?FeatureType\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?FeatureType>/g;
                  var out = [], seen = {}, m;

                  while ((m = re.exec(value)) !== null) {
                      var name = /<(?:[\w.-]+:)?Name\b[^>]*>([^<]*)</.exec(m[1]);
                      if (!name) {
                          continue;
                      }
                      var n = decode(name[1]);
                      if (n === '' || seen[n]) {
                          continue;
                      }
                      seen[n] = 1;
                      var title = /<(?:[\w.-]+:)?Title\b[^>]*>([^<]*)</.exec(m[1]);
                      out.push({'{#CAMADA}': n, '{#CAMADA.TITULO}': title ? decode(title[1]) : n});
                  }

                  if (out.length === 0) {
                      throw 'Nenhum FeatureType encontrado no GetCapabilities';
                  }

                  out.sort(function (a, b) { return a['{#CAMADA}'] < b['{#CAMADA}'] ? -1 : 1; });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          lifetime: 7d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
