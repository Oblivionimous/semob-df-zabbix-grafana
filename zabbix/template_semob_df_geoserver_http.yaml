          graph_prototypes:
            - uuid: 1fad0fced7454363b036eb45c7895c9b
              name: 'Operadora [{#OPERADORA.ID} - {#OPERADORA.NOME}]: veículos'
              graph_items:
                - color: 199C0D
                  item:
                    host: SEMOB DF GeoServer by HTTP
                    key: semob.positions.operator.fresh[{#OPERADORA.ID}]
                - sortorder: '1'
                  color: 2774A4
                  item:
                    host: SEMOB DF GeoServer by HTTP
                    key: semob.positions.operator.moving[{#OPERADORA.ID}]
                - sortorder: '2'
