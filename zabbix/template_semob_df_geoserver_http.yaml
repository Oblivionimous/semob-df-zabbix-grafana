        - uuid: dd3d011c5f484e7fb2eff512cd5c17c2
          name: 'WFS: camadas publicadas'
          type: DEPENDENT
          key: semob.wfs.layers
          delay: '0'
          history: 31d
          value_type: UNSIGNED
          description: Quantidade de FeatureType no GetCapabilities. Em 09/10/2026 eram 14.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Extrai Name e Title de cada FeatureType do WFS GetCapabilities (prefixos de namespace opcionais).
                  if (value.indexOf('WFS_Capabilities') === -1) {
                      throw 'Resposta não é um documento WFS GetCapabilities';
                  }

                  function decode(s) {
                      return s.replace(/&#(\d+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 10)); })
                          .replace(/&#x([0-9a-fA-F]+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 16)); })
                          .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
                          .replace(/&amp;/g, '&').trim();
                  }

                  var re = /<(?:[\w.-]+:)?FeatureType\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?FeatureType>/g;
                  var out = [], seen = {}, m;

                  while ((m = re.exec(value)) !== null) {
                      var name = /<(?:[\w.-]+:)?Name\b[^>]*>([^<]*)</.exec(m[1]);
                      if (!name) {
                          continue;
                      }
                      var n = decode(name[1]);
                      if (n === '' || seen[n]) {
                          continue;
                      }
                      seen[n] = 1;
                      var title = /<(?:[\w.-]+:)?Title\b[^>]*>([^<]*)</.exec(m[1]);
                      out.push({'{#CAMADA}': n, '{#CAMADA.TITULO}': title ? decode(title[1]) : n});
                  }

                  if (out.length === 0) {
                      throw 'Nenhum FeatureType encontrado no GetCapabilities';
                  }

                  out.sort(function (a, b) { return a['{#CAMADA}'] < b['{#CAMADA}'] ? -1 : 1; });
                  return JSON.stringify(out);
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: semob.wfs.capabilities
          tags:
            - tag: component
              value: camadas
          triggers:
            - uuid: b7fd3c7683784ee28f5e38e5c99d37d0
              expression: change(/SEMOB DF GeoServer by HTTP/semob.wfs.layers)<>0
              name: 'SEMOB: catálogo WFS mudou de quantidade de camadas'
              opdata: 'Camadas: {ITEM.LASTVALUE1}'
              priority: INFO
              description: Camadas foram publicadas ou removidas. Revise as camadas descobertas.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: inventory
      discovery_rules:
        - uuid: a603628fea51443eb61d1e7c6c5a2ae7
          name: Descoberta de operadoras nas posições
          type: SCRIPT
          key: semob.positions.operators.discovery
          delay: '{$SEMOB.OPERADORAS.INTERVAL}'
          params: |
            // Descobre as operadoras presentes nas posições e traduz id_operadora para nome com a camada "Horários das Linhas".
            // Parâmetros do item: url, count.
            // Classificação: nome com BACIA = concessão, COOBRATAETE = cooperativa, demais nomes = permissionário do STPCR.
            // Permissionários do STPCR são pessoas físicas: o nome é substituído antes da saída e não chega ao Zabbix.
            var p = JSON.parse(value);

            function wfs(typeName, props, count) {
                var req = new HttpRequest();
                var url = p.url + '?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application%2Fjson'
                    + '&typeNames=' + encodeURIComponent(typeName) + '&propertyName=' + encodeURIComponent(props)
                    + (count ? '&count=' + encodeURIComponent(count) : '');
                var body = req.get(url);
                if (req.getStatus() !== 200) {
                    throw 'HTTP ' + req.getStatus() + ' ao consultar ' + typeName;
                }
                var d;
                try {
                    d = JSON.parse(body);
                }
                catch (e) {
                    throw 'Resposta não JSON ao consultar ' + typeName;
                }
                if (!d || d.type !== 'FeatureCollection' || !(d.features instanceof Array)) {
                    throw 'Resposta sem FeatureCollection ao consultar ' + typeName;
                }
                return d.features;
            }

            function text(v) {
                return (v === null || v === undefined) ? '' : String(v).replace(/[\u0000-\u001f\u007f]/g, '').trim();
            }

            function classify(name, known) {
                if (!known) {
                    return {servico: 'não identificado', bacia: 'sem bacia'};
                }
                var m = /BACIA\s*-?\s*0?(\d)/i.exec(name);
                var bacia = m ? '0' + m[1] : 'sem bacia';
                if (/COOBRATAETE/i.test(name)) {
                    return {servico: 'cooperativa', bacia: bacia};
                }
                return {servico: m ? 'concessão' : 'STPCR', bacia: bacia};
            }

            var names = {};
            var sched = wfs('semob:Horários das Linhas', 'id_operadora,nm_operadora');
            for (var i = 0; i < sched.length; i++) {
                var sp = sched[i].properties || {};
                var sid = text(sp.id_operadora), sname = text(sp.nm_operadora);
                if (sid !== '' && sname !== '') {
                    names[sid] = sname;
                }
            }

            var ids = {};
            var pos = wfs('semob:ultima_posicao', 'id_operadora', p.count);
            for (var j = 0; j < pos.length; j++) {
                var pp = pos[j].properties || {};
                ids[(pp.id_operadora === null || pp.id_operadora === undefined) ? 'desconhecida' : text(pp.id_operadora)] = 1;
            }

            var out = [], list = Object.keys(ids).sort();
            for (var k = 0; k < list.length; k++) {
                var id = list[k], known = names.hasOwnProperty(id);
                var name = known ? names[id] : (id === 'desconhecida' ? 'sem id_operadora' : 'não identificada');
                var c = classify(name, known);
                if (c.servico === 'STPCR') {
                    name = 'STPCR (permissionário)';  // pessoa física: o nome não é publicado no Zabbix
                }
                out.push({'{#OPERADORA.ID}': id, '{#OPERADORA.NOME}': name,
                          '{#OPERADORA.BACIA}': c.bacia, '{#OPERADORA.SERVICO}': c.servico});
            }

            if (out.length === 0) {
                throw 'Nenhuma operadora encontrada nas posições';
            }
            return JSON.stringify(out);
          parameters:
            - name: url
              value: '{$SEMOB.URL}'
            - name: count
              value: '{$SEMOB.POS.COUNT}'
          timeout: '{$SEMOB.TIMEOUT}'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#OPERADORA.SERVICO}'
                value: '{$SEMOB.OPERADORA.SERVICO.EXCLUIR}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          description: 'Script: lê os id_operadora das posições e traduz para nome pela camada "Horários das Linhas". Classifica pelo nome publicado: BACIA = concessão, COOBRATAETE = cooperativa, demais = STPCR. Permissionários do STPCR são pessoas físicas: o nome é substituído no script e, pelo filtro padrão, eles e os códigos sem nome não geram itens. Os totais gerais continuam incluindo todos os veículos.'
          item_prototypes:
            - uuid: 4b0a40172ea34075896c266470cc4261
              name: 'Operadora [{#OPERADORA.ID} - {#OPERADORA.NOME}]: registros'
              type: DEPENDENT
              key: semob.positions.operator.total[{#OPERADORA.ID}]
              delay: '0'
