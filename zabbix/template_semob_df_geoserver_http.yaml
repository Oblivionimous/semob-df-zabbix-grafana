        - uuid: 9018fe98d835430485b759b5a8f2231e
          name: 'WFS: GetCapabilities'
          type: HTTP_AGENT
          key: semob.wfs.capabilities
          delay: '{$SEMOB.CAPS.INTERVAL}'
          history: '0'
          value_type: TEXT
          timeout: '{$SEMOB.TIMEOUT}'
          url: '{$SEMOB.URL}'
          query_fields:
            - name: service
              value: WFS
            - name: version
              value: 2.0.0
            - name: request
              value: GetCapabilities
          verify_peer: 'YES'
          verify_host: 'YES'
          description: Documento de capacidades do WFS. Mestre da descoberta de camadas.
          tags:
