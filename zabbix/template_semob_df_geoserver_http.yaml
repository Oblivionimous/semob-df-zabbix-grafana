              value_type: UNSIGNED
              description: Registros da operadora no snapshot. Identificador id_operadora da SEMOB.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.operators['{#OPERADORA.ID}'].total
                  error_handler: DISCARD_VALUE
              master_item:
                key: semob.positions.stats
              tags:
                - tag: component
                  value: posicoes
                - tag: operadora
                  value: '{#OPERADORA.NOME}'
                - tag: operadora_id
                  value: '{#OPERADORA.ID}'
                - tag: bacia
