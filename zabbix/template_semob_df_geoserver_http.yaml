        - uuid: e682bceac57245c3925dc31960463635
          name: 'Frota: resumo calculado'
          type: DEPENDENT
          key: semob.fleet.stats
          delay: '0'
          history: 7d
          value_type: TEXT
          description: JSON intermediário com totais, idade média e frota por operadora.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Resume a camada "semob:Frota por Operadora" (GeoJSON WFS 2.0): total, idade e frota por operadora.
                  var out = {ok: 0};
                  var data;

                  try {
                      data = JSON.parse(value);
                  }
                  catch (e) {
                      out.error = 'Resposta não é JSON: falha HTTP ou ExceptionReport do GeoServer';
                      return JSON.stringify(out);
                  }

                  if (!data || data.type !== 'FeatureCollection' || !(data.features instanceof Array)) {
                      out.error = 'JSON sem FeatureCollection';
                      return JSON.stringify(out);
                  }

                  // Permissionários do STPCR são pessoas físicas: os nomes não saem deste script, só o total agregado.
                  var STPCR_BUCKET = 'STPCR (permissionários)';

                  function text(v) {
                      return (v === null || v === undefined) ? '' : String(v).replace(/[\u0000-\u001f\u007f]/g, '').trim();
                  }

                  function slug(name) {
                      var from = 'ÁÀÂÃÄÉÈÊËÍÌÎÏÓÒÔÕÖÚÙÛÜÇÑáàâãäéèêëíìîïóòôõöúùûüçñ';
                      var to = 'AAAAAEEEEIIIIOOOOOUUUUCNAAAAAEEEEIIIIOOOOOUUUUCN';
                      var r = '';
                      for (var i = 0; i < name.length; i++) {
                          var c = name.charAt(i), x = from.indexOf(c);
                          r += x >= 0 ? to.charAt(x) : c;
                      }
                      r = r.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
                      return r === '' ? 'SEM_NOME' : r;
                  }

                  var now = new Date();
                  var year = now.getUTCFullYear();
                  var f = data.features;
                  var byName = {}, newestRef = NaN, ageSum = 0, ageN = 0, invalidYear = 0;

                  for (var i = 0; i < f.length; i++) {
                      var p = (f[i] && f[i].properties) || {};
                      var name = text(p.operadora) || '(sem operadora)';
                      if (name !== '(sem operadora)' && !/BACIA/i.test(name) && !/COOBRATAETE/i.test(name)) {
                          name = STPCR_BUCKET;
                      }
                      if (!byName[name]) {
                          byName[name] = {total: 0, ageSum: 0, ageN: 0};
                      }
                      var o = byName[name];
                      o.total++;

                      var y = parseInt(p.ano_fabrica, 10);
                      if (isNaN(y) || y < 1950 || y > year + 1) {
                          invalidYear++;
                      }
                      else {
                          var age = Math.max(0, year - y);
                          o.ageSum += age;
                          o.ageN++;
                          ageSum += age;
                          ageN++;
                      }

                      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(text(p.data_referencia));
                      if (m) {
                          var t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
                          if (isNaN(newestRef) || t > newestRef) {
                              newestRef = t;
                          }
                      }
                  }

                  var names = Object.keys(byName).sort();
                  var used = {};
                  out.ok = 1;
                  out.total = f.length;
                  out.operators_count = names.length;
                  out.invalid_year = invalidYear;
                  if (ageN > 0) {
                      out.avg_age = Math.round(ageSum * 100 / ageN) / 100;
                  }
                  if (!isNaN(newestRef)) {
                      out.ref_age = Math.max(0, Math.round((now.getTime() - newestRef) / 1000));
                  }
                  out.operators = {};
                  out.lld = [];

                  for (var j = 0; j < names.length; j++) {
                      var base = slug(names[j]), key = base, n = 2;
                      while (used[key]) {
                          key = base + '_' + n++;
                      }
                      used[key] = 1;
                      var e = byName[names[j]];
                      out.operators[key] = {name: names[j], total: e.total};
                      if (e.ageN > 0) {
                          out.operators[key].avg_age = Math.round(e.ageSum * 100 / e.ageN) / 100;
                      }
                      var m = /BACIA\s*-?\s*0?(\d)/i.exec(names[j]);
                      var servico = /COOBRATAETE/i.test(names[j]) ? 'cooperativa' : (m ? 'concessão' : 'STPCR');
                      if (names[j] === '(sem operadora)') {
                          servico = 'não identificado';
                      }
                      out.lld.push({'{#OPERADORA.NOME}': names[j], '{#OPERADORA.KEY}': key,
                                    '{#OPERADORA.BACIA}': m ? '0' + m[1] : 'sem bacia', '{#OPERADORA.SERVICO}': servico});
                  }

                  return JSON.stringify(out);
          master_item:
            key: semob.fleet.raw
          tags:
            - tag: component
              value: frota
